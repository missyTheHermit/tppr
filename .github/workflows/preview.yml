name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BACKEND_URL: https://tppr.online
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://cluyyfskyifnbjaylltt.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Bns-As3rN7xwMuwNnrZp4w_fkwfdT6F' }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tppr-preview' }}

jobs:
  fork-preview-note:
    name: Fork preview handled by fork
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - name: Explain fork preview
        run: |
          echo "This pull request comes from a fork, so GitHub does not pass repository secrets to this workflow."
          echo "The fork-preview workflow in the fork deploys Cloudflare Pages and comments back on the upstream PR."

  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in this repository's Actions secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
          BACKEND_URL: ${{ env.BACKEND_URL }}
        run: bun run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          npx wrangler@latest pages deploy frontend/dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch "$branch" \
            --commit-dirty=true \
            | tee "$RUNNER_TEMP/wrangler-output.txt"
          url=$(grep -Eo 'https://[^ ]+\.pages\.dev' "$RUNNER_TEMP/wrangler-output.txt" | tail -n 1)
          if [ -z "$url" ]; then
            echo "::error::Cloudflare deployment did not print a pages.dev URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.url }}';
            const body = [
              '### Preview deployed',
              '',
              previewUrl ? `Preview: ${previewUrl}` : 'Preview deployed, but Cloudflare did not return a URL.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '### Preview deployed';
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
